{% extends "base.html" %}{% block title %}Sign In — SourceTrace AI{% endblock %}
{% block content %}<section class="auth-section"><div class="auth-card"><span class="brand-mark"><i class="bi bi-shield-check"></i></span><span class="eyebrow">Welcome back</span><h1>Sign in to your workspace</h1><p>Access your private document-analysis history.</p><form method="post"><label class="form-label" for="email">Email address</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required><label class="form-label mt-3" for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required><button class="btn btn-primary btn-lg w-100 mt-4">Sign In</button></form><p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create a free account</a></p></div></section>{% endblock %}
