{% extends "base.html" %}{% block title %}Create Account — VeritasCheck{% endblock %}
{% block content %}<section class="auth-section"><div class="auth-card"><span class="brand-mark"><i class="bi bi-person-check"></i></span><span class="eyebrow">Private workspace</span><h1>Create your account</h1><p>Save analysis reports and return to them anytime. No payment or subscription.</p><form method="post"><label class="form-label" for="name">Full name</label><input class="form-control" id="name" name="name" autocomplete="name" required><label class="form-label mt-3" for="email">Email address</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required><label class="form-label mt-3" for="password">Password</label><input class="form-control" id="password" name="password" type="password" minlength="8" autocomplete="new-password" required><small class="form-help">Use at least 8 characters.</small><button class="btn btn-primary btn-lg w-100 mt-4">Create Account</button></form><p class="auth-switch">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div></section>{% endblock %}
